function reward(key,value){if(state.rewarded.includes(key))return;state.rewarded.push(key);state.coins+=value;save();syncWallet()}
function spend(amount){if(state.coins<amount){message="Недостаточно монет. Зарабатывай их правильными ответами.";return false}state.coins-=amount;save();syncWallet();return true}

function shopHTML(){return '<section class="shop"><h2>🛍 Магазин достижений</h2><p>За правильные ответы получай монеты и выбирай награды. Покупки не влияют на оценки и открытие уровней.</p><div class="shop-grid">'+SHOP.map(x=>{const owned=state.purchases.includes(x[0]);return '<div class="shop-item"><b>'+x[1]+'</b><small>'+x[2]+'</small><button class="secondary" data-buy="'+x[0]+'" '+(owned&&x[0]==="badge"?'disabled':'')+'>'+(owned?(x[0]==="badge"?"Получено ✓":state.theme===x[0]?"Активно ✓":"Применить"):"🪙 "+x[3])+'</button></div>'}).join("")+'</div>'+(state.purchases.includes("badge")?'<p>🏅 Твой значок: «Старательный»</p>':'')+(message?'<div class="feedback">'+esc(message)+'</div>':'')+'</section>'}
syncWallet();

const CONTEXTS={"Дефект":"На новой окраске обнаружили пузырь и пятно. Как называется такой недостаток?","Срок":"Мастер спрашивает, к какому дню закончат исправление. Что нужно уточнить?","Этап":"Сначала подготовка, потом окраска. Как называется одна такая часть большой работы?","Результат":"Поверхность покрасили, теперь проверяют, что получилось. Как называется итог работы?","Замечание":"На осмотре указали на неровность стены. Как назвать это указание?","Проверка":"Мастер осматривает стену после исправления. Как называется такое действие?","Объём":"Нужно узнать, сколько квадратных метров стены окрашено. Что измеряют?","Причина":"Трещина появилась снова. Нужно выяснить, из-за чего. Что ищем?","Исправление":"Мастер устранил царапину и снова покрасил участок. Что он выполнил?","Задача":"Работнику поручили к вечеру завершить окраску двери. Что ему поставили?","Фронт работ":"Маляры ждут, пока электрики освободят помещение. Что ещё не подготовлено?","Смежные работы":"Штукатуры ждут окончания сантехнического монтажа. Как называются связанные работы других бригад?","Приёмка":"Результат проверяют перед передачей заказчику. Как называется эта процедура?","План-факт":"За неделю планировали 200 м², а сделали 160 м². Как называется такое сравнение?","Участок":"Бригада работает только в одной части здания. Как назвать эту часть объекта?","Подрядчик":"Организация выполняет отделку по договору. Как назвать её роль?","Готовность":"Нужно понять, можно ли уже предъявить помещение для проверки. Что оцениваем?","Отклонение":"Обещали закончить в понедельник, сделали в среду. Как называется разница с планом?","Контроль качества":"Проверяем, соответствует ли подготовка стен требованиям. Как называется такая проверка?","Ответственность":"Нужно определить, кто отвечает за результат работы. Что закрепляем?"};
const PRACTICE_VER=2;
function unlocked(i){return i===0||!!state.done[i-1]}
function levelState(i){
 state.learningV2??={};
 if(!state.learningV2[i]){
  state.learningV2[i]={group:0,studied:0,phase:"study",cursor:0,errors:0};
  state.legacyProgress??={};
  if(Number(state.progress?.[i])>0&&!state.done[i])state.legacyProgress[i]=state.progress[i];
  save();
 }
 return state.learningV2[i]
}
function groupRange(i,g){
 const start=[0,3,6][g]??0;return levels[i].terms.slice(start,g===2?10:start+3).map((t,n)=>({term:t,idx:start+n}))
}
function deck(i,g){
 const range=groupRange(i,g),n=range.length,arr=[];
 const kinds1=["pick","context","simple","context"],kinds2=["repair","simple","pick","repair"];
 // Two mixed rounds before active recall; no word is tested immediately after being shown.
 for(let j=0;j<n;j++)arr.push({idx:range[j].idx,kind:kinds1[(j+g)%kinds1.length]});
 const order2=n===3?[1,2,0]:[2,0,3,1];
 for(const j of order2)arr.push({idx:range[j].idx,kind:kinds2[(j+g)%kinds2.length]});
 const order3=n===3?[1,0,2]:[3,1,2,0];
 for(const j of order3)arr.push({idx:range[j].idx,kind:"recall"});
 return arr
}
function stage(i){const p=levelState(i);return p.group>=3?(p.phase==="reading"?"reading":"sentence"):p.phase}
function stepLabel(i){const l=levelState(i);if(l.group>=3)return l.phase==="reading"?"Чтение вслух":"Собираем предложение";const range=groupRange(i,l.group);if(l.phase==="study")return "Изучение: "+(l.studied+1)+" из "+range.length+" · набор "+(l.group+1)+"/3";return "Практика: "+(l.cursor+1)+" из "+deck(i,l.group).length+" · набор "+(l.group+1)+"/3"}
function completedSteps(i){const l=levelState(i);let p=0;for(let g=0;g<Math.min(l.group,3);g++)p+=groupRange(i,g).length+deck(i,g).length;if(l.group<3)p+=l.phase==="study"?l.studied:groupRange(i,l.group).length+l.cursor;else p+=l.phase==="reading"?41:40;return Math.min(p,42)}
function viewHome(){
 chosen=null;message="";window.TrainerVoice.reset();syncWallet();
 const done=state.done.filter(Boolean).length;
 const totalProgress=levels.reduce((acc,l,i)=>acc+(state.done[i]?42:completedSteps(i)),0);
 app.innerHTML='<section class="hero"><div class="eyebrow">Учимся от простого к сложному</div><div class="illustration" aria-hidden="true">📚✨</div><h1>Сначала слово.<br>Потом речь.</h1><p class="lead">Изучаем несколько слов вместе, затем тренируем их вперемешку: смысл, рабочие ситуации, исправление ошибок и самостоятельное вспоминание. Ответ не следует сразу за подсказкой.</p><div class="hero-foot"><span class="chip">5 уровней</span><span class="chip">42 шага на уровень</span><span class="chip">Разные типы вопросов</span></div></section>'+
 '<div class="section-title">Твой путь · '+done+' из 5 уровней</div><div class="progress"><div style="width:'+Math.min(100,Math.round(totalProgress/210*100))+'%"></div></div>'+
 '<section class="path">'+levels.map((l,i)=>'<button class="level" data-level="'+i+'" '+(!unlocked(i)?'disabled aria-label="Уровень пока закрыт"':'')+'><span class="emoji" aria-hidden="true">'+l.emoji+'</span><span><b>'+(i+1)+'. '+esc(l.name)+'</b><small>'+esc(l.desc)+'</small></span><span class="status">'+(state.done[i]?'✓ Пройден':!unlocked(i)?'🔒 Закрыт':completedSteps(i)?'Продолжить':'Начать')+'</span></button>').join("")+'</section>'+
 '<p class="hint">В каждом уровне 10 слов в трёх наборах, 30 смешанных вопросов, короткое предложение и чтение. Старый прогресс и журнал сохранены; незавершённый урок по новой методике начинается с первого набора.</p>'+shopHTML()+
 '<div class="actions"><button class="secondary" data-act="restart">Начать курс сначала</button><a class="secondary" href="./index.html" style="text-decoration:none">Старый тренажёр</a></div>';
}
function openLevel(i){
 if(!unlocked(i))return;
 if(chosen!==null)window.TrainerVoice.reset();
 chosen=i;message="";transcript="";readAnalysis=null;
 if(state.done[i]){
  state.learningV2[i]={group:0,studied:0,phase:"study",cursor:0,errors:0};
  save();
 }
 levelState(i);viewLesson();
}
function nextStudy(){
 const l=levelState(chosen),count=groupRange(chosen,l.group).length;
 if(l.phase!=="study")return;
 l.studied++;
 if(l.studied>=count){l.phase="practice";l.cursor=0}
 message="";save();viewLesson()
}
function nextPractice(successFirstTry){
 const l=levelState(chosen),task=deck(chosen,l.group)[l.cursor];
 if(successFirstTry)reward("v2:l"+chosen+":g"+l.group+":task"+l.cursor,task.kind==="recall"?3:2);
 l.cursor++;l.errors=0;message="";
 if(l.cursor>=deck(chosen,l.group).length){
  l.group++;l.studied=0;l.cursor=0;
  l.phase=l.group>=3?"sentence":"study";
 }
 save();viewLesson()
}
function optionsFor(i,g){const range=groupRange(i,g);return range.map(x=>x.term[0])}
function rotateOptions(arr,seed){const shift=seed%arr.length;return arr.slice(shift).concat(arr.slice(0,shift))}
function renderTaskBody(task){
 const current=levels[chosen].terms[task.idx],l=levelState(chosen),range=groupRange(chosen,l.group);
 const distract=range.find(x=>x.idx!==task.idx)?.term[0]||"другое слово";
 const options=rotateOptions(optionsFor(chosen,l.group),l.cursor+chosen);
 let title="",question="",hint="",key="pick";
 if(task.kind==="pick"){title="Найди точное слово";question=current[1]}
 if(task.kind==="context"){title="Слово в рабочей ситуации";question=CONTEXTS[current[0]]||"На объекте сказали: «"+current[1]+"». Как назвать это понятие?"}
 if(task.kind==="simple"){
  title="Объясни проще";question="Что означает «"+current[0]+"»?";
  const opts=rotateOptions(range.map(x=>x.term[1]),l.cursor+1);
  return '<div class="lesson-hero" aria-hidden="true">💬</div><div class="eyebrow">'+title+'</div><h2 class="word">'+esc(question)+'</h2><div class="mini">Выбирай по смыслу, а не наугад.</div>'+
   opts.map(o=>'<button class="choice" data-choice="'+(o===current[1]?"yes":"no")+'">'+esc(o)+'</button>').join("")+
   (message?'<div class="feedback">'+esc(message)+'</div>':'')
 }
 if(task.kind==="repair"){title="Исправь путаницу";question="Ученик назвал ситуацию «"+current[1]+"» словом «"+distract+"». Какое слово на самом деле подходит?"}
 if(task.kind==="recall"){
  return '<div class="lesson-hero" aria-hidden="true">✍️</div><div class="eyebrow">Вспомни без списка вариантов</div><h2 class="word">'+esc(current[1])+'</h2>'+
   '<p class="mini">Тебе объяснили это слово несколько заданий назад. Теперь попробуй назвать его самостоятельно.</p>'+
   '<input class="field" id="recall" autocomplete="off" placeholder="Напиши термин"><div class="actions"><button class="primary" data-act="recall">Проверить</button><button class="secondary" data-act="hint">Подсказка</button></div>'+
   (message?'<div class="feedback">'+esc(message)+'</div>':'')
 }
 return '<div class="lesson-hero" aria-hidden="true">🧠</div><div class="eyebrow">'+title+'</div><h2 class="word">'+esc(question)+'</h2>'+
  options.map(o=>'<button class="choice" data-choice="'+(o===current[0]?"yes":"no")+'">'+esc(o)+'</button>').join("")+
  (message?'<div class="feedback">'+esc(message)+'</div>':'')
}
function viewLesson(){
 if(chosen===null){viewHome();return}
 const level=levels[chosen],l=levelState(chosen),kind=stage(chosen);
 const meter=Math.round(completedSteps(chosen)/42*100);
 let body="";
 if(kind==="study"){
  const range=groupRange(chosen,l.group),t=range[l.studied].term;
  body='<div class="lesson-hero" aria-hidden="true">📖</div><div class="eyebrow">Набор '+(l.group+1)+' из 3 · Сначала познакомимся со словами</div><h2 class="word">'+esc(t[0])+'</h2><p class="definition">'+esc(t[1])+'</p>'+
   '<div class="example"><b>Пример:</b> '+esc(t[2])+'</div><p class="mini">Сейчас только знакомимся. Вопросы по всем словам набора появятся позже — в разном порядке.</p>'+
   '<div class="actions"><button class="primary" data-act="study-next">'+(l.studied===range.length-1?"Перейти к практике →":"Следующее слово →")+'</button></div>';
 }else if(kind==="practice"){
  const task=deck(chosen,l.group)[l.cursor];body=renderTaskBody(task)
 }else if(kind==="sentence"){
  body='<div class="lesson-hero" aria-hidden="true">🧩</div><div class="eyebrow">Короткое предложение</div><p class="definition">'+esc(level.sentence)+'</p>'+
  '<p class="mini">Это слово мы уже изучили и повторили. Подставь подходящий термин.</p>'+
  '<input class="field" id="sentence" autocomplete="off" placeholder="Твой ответ"><div class="actions"><button class="primary" data-act="sentence">Проверить</button><button class="secondary" data-act="sentence-hint">Подсказка</button></div>'+
  (message?'<div class="feedback">'+esc(message)+'</div>':'');
 }else{
  const v=window.TrainerVoice.state();
  body='<div class="lesson-hero" aria-hidden="true">🎙️</div><div class="eyebrow">Чтение вслух · уровень '+(chosen+1)+'</div>'+
   '<p class="mini">Прочитай текст спокойно. Запиши голос и прослушай его. Если распознавание поддерживается, увидишь примерное совпадение слов. Запись необязательна для завершения уровня.</p>'+
   '<div class="reading">'+esc(level.read)+'</div><div class="audio">'+window.TrainerVoice.box({record:true,dictate:false})+'</div>'+
   (readAnalysis?'<div class="score">'+(readAnalysis.available?'Совпадение распознанных слов: <b>'+readAnalysis.coverage+'%</b>. Примерный темп: '+(readAnalysis.rate||"—")+' слов/мин.':'Распознавание недоступно. Оцени чтение по записи самостоятельно.')+'<div class="mini">Это не оценка дикции, произношения или уверенности.</div></div>':'')+
   '<div class="actions">'+(v.blob?'<button class="secondary" data-act="assess">Сравнить с текстом</button>':'')+'<button class="primary" data-act="finish">Завершить уровень ✓</button></div>';
 }
 app.innerHTML='<div class="breadcrumb"><span>Уровень '+(chosen+1)+' из 5 · '+esc(level.name)+'</span><span>'+stepLabel(chosen)+'</span></div>'+
 '<div class="progress"><div style="width:'+meter+'%"></div></div><div class="panel">'+body+'</div>'+
 '<div class="actions"><button class="secondary" data-act="home">← К карте уровней</button></div>';
}
function checkedWord(v,expected){return norm(v)===norm(expected)}
function checkedWord(v,expected){return norm(v)===norm(expected)}
function finish(){
 if(chosen===null||levelState(chosen).phase!=="reading")return;
 const v=window.TrainerVoice.state();const a=window.TrainerReading.analyze(levels[chosen].read,v.transcript||transcript,v.durationMs);
 reward("level"+chosen+":finish",10);state.done[chosen]=true;
 if(!Array.isArray(state.readingHistory))state.readingHistory=[];
 state.readingHistory.push({level:chosen+1,at:new Date().toISOString(),clipId:v.clipId||null,coverage:a.available?a.coverage:null});
 state.progress[chosen]=0;save();window.TrainerVoice.reset();
 const name=levels[chosen].name,next=chosen+1;chosen=null;
 app.innerHTML='<div class="panel" style="text-align:center"><div class="lesson-hero" aria-hidden="true">🎉</div><div class="eyebrow">Уровень завершён</div><h1 style="margin:12px 0">'+esc(name)+'</h1><p class="definition">Ты изучил слова группами, ответил на 30 вопросов разных форматов, составил предложение и дошёл до чтения.</p><div class="actions" style="justify-content:center"><button class="primary" data-act="home">К карте уровней</button>'+(next<levels.length?'<button class="secondary" data-next="'+next+'">Следующий уровень →</button>':'')+'</div></div>';
}
app.addEventListener("click",e=>{
 const target=e.target.closest("button");if(!target)return;
 if(target.hasAttribute("data-buy")){
  const item=SHOP.find(x=>x[0]===target.dataset.buy);if(!item)return;
  if(!state.purchases.includes(item[0])){if(!spend(item[3])){viewHome();return}state.purchases.push(item[0]);}
  if(item[0]!=="badge")state.theme=item[0];save();viewHome();return
 }
 if(target.hasAttribute("data-level")){openLevel(Number(target.dataset.level));return}
 if(target.hasAttribute("data-next")){openLevel(Number(target.dataset.next));return}
 const act=target.dataset.act||target.dataset.action||"";
 if(act==="home"){viewHome();return}
 if(act==="restart"){
  if(confirm("Начать курс с первого уровня? История, прежние ответы, монеты и купленные награды останутся.")){
   state={...state,done:[],progress:{},learningV2:{},readingHistory:Array.isArray(state.readingHistory)?state.readingHistory:[]};save();viewHome()
  }return
 }
 if(chosen===null)return;
 const l=levelState(chosen),kind=stage(chosen);
 if(act==="study-next"&&kind==="study"){nextStudy();return}
 if(target.hasAttribute("data-choice")&&kind==="practice"){
  if(target.dataset.choice==="yes"){nextPractice(!l.errors)}
  else{l.errors++;message="Пока не тот ответ. Подумай, какое понятие точнее. Ошибаться можно — монеты за этот вопрос начисляются только за первый правильный ответ.";save();viewLesson()}
  return
 }
 if(act==="recall"&&kind==="practice"){
  const task=deck(chosen,l.group)[l.cursor];if(task.kind!=="recall")return;
  const answer=levels[chosen].terms[task.idx][0];
  if(checkedWord(document.getElementById("recall")?.value,answer))nextPractice(!l.errors);
  else{l.errors++;message="Слово пока не вспомнилось. Попробуй ещё раз; можно открыть подсказку.";save();viewLesson()}
  return
 }
 if(act==="hint"&&kind==="practice"){
  const task=deck(chosen,l.group)[l.cursor];const answer=levels[chosen].terms[task.idx][0];
  l.errors++;message="Подсказка: первая буква «"+answer[0]+"», букв в названии: "+answer.length+".";
  save();viewLesson();return
 }
 if(act==="sentence-hint"&&kind==="sentence"){message="Слово из этого уровня. Начинается на «"+levels[chosen].answer[0]+"».";viewLesson();return}
 if(act==="sentence"&&kind==="sentence"){
  const answer=levels[chosen].answer;
  if(checkedWord(document.getElementById("sentence")?.value,answer)){
   reward("v2:l"+chosen+":sentence",5);l.phase="reading";message="";save();viewLesson()
  }else{message="Попробуй снова. Это слово из изученного уровня.";viewLesson()}return
 }
 if(kind!=="reading")return;
 if(act==="voice-record"){window.TrainerVoice.record(()=>viewLesson(),null,s=>{transcript=s});return}
 if(act==="voice-stop"){window.TrainerVoice.stop(()=>viewLesson());return}
 if(act==="voice-download"){window.TrainerVoice.download();return}
 if(act==="assess"){
  const v=window.TrainerVoice.state();readAnalysis=window.TrainerReading.analyze(levels[chosen].read,v.transcript||transcript,v.durationMs);viewLesson();return
 }
 if(act==="finish"){finish();return}
});
app.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&e.target.id==="recall"){e.preventDefault();app.querySelector('[data-act="recall"]')?.click()}
 if(e.key==="Enter"&&e.target.id==="sentence"){e.preventDefault();app.querySelector('[data-act="sentence"]')?.click()}
});
viewHome();
})();
</script>
