const SPACING=[1,3,7,14,30], DAY=86400000;
function wordDB(){if(!state.wordDB)state.wordDB={};return state.wordDB}
function trackWord(i,j,success,kind="legacy",source="lesson"){
 const key=i+":"+j,db=wordDB(),old=db[key]||{tries:0,streak:0,errors:0};
 const modes={...old.modes},m=modes[kind]||{tries:0,errors:0};
 modes[kind]={tries:m.tries+1,errors:m.errors+(success?0:1)};
 const independent=kind==="recall"||kind==="context-recall"||kind==="fill";
 const now=Date.now(),day=moscowDay(),prior=old.recallDays||0;
 const recallDays=!success?0:independent&&old.lastRecallDay!==day?prior+1:prior;
 const streak=success?(old.streak||0)+1:0;
 const due=!success?now:independent?now+SPACING[Math.min(Math.max(recallDays-1,0),4)]*DAY:Math.min(old.due??now,now);
 db[key]={...old,tries:(old.tries||0)+1,streak,errors:(old.errors||0)+(success?0:1),due,modes,recallDays,lastRecallDay:success&&independent?day:old.lastRecallDay,lastKind:kind,lastSource:source};
 save();
}
function reviewQueue(){
 const db=wordDB(),items=[];
 for(let i=0;i<levels.length;i++)for(let j=0;j<levels[i].terms.length;j++){const v=db[i+":"+j];if(v?.tries)items.push({i,j,...v})}
 return items;
}

 const rows=all.map(x=>'<li>'+esc(levels[x.i].terms[x.j][0])+' — '+(x.due<=Date.now()?'повторить':(x.recallDays||0)>=3?'вспомнено в разные дни':'закрепляется')+' · самостоятельных дней: '+(x.recallDays||0)+' · ошибок: '+(x.errors||0)+'</li>').join("");
 return '<section class="panel" style="margin-top:18px"><div class="eyebrow">Персональное закрепление</div><h2>🧠 Моя память</h2><p class="mini">Интервалы 1, 3, 7, 14 и 30 дней растут только за самостоятельное вспоминание в разные дни. Выбор ответа не заменяет память.</p><div class="hero-foot"><span class="chip">Тренировалось: '+all.length+'/50</span><span class="chip">Повторить: '+due.length+'</span><span class="chip">Уверенно: '+strong.length+'</span></div><p class="mini">'+(due.length?'В первую очередь: '+due.slice(0,5).map(x=>esc(levels[x.i].terms[x.j][0])).join(' · '):future.length?'Следующее повторение: '+new Date(future[0].due).toLocaleDateString("ru-RU"):'Начни основной урок, чтобы появились слова.')+'</p><details><summary>Мой словарь и ошибки</summary><ul>'+rows+'</ul></details><div class="actions"><button class="primary" data-act="review-start" '+(!due.length?'disabled':'')+'>Повторить '+Math.min(due.length,8)+' слов</button></div></section>';
}

function startReview(){const q=dueWords().slice(0,8).map(x=>({...x,kind:reviewKind(x)}));if(!q.length){viewHome();return}review={q,n:0,errors:0,clean:0,assisted:0};chosen=null;message="";window.TrainerVoice.reset();renderReview()}

 const term=levels[x.i].terms[x.j],v=VARIETY[term[0]],question=x.kind==="fill"?v[0]:x.kind==="context-recall"?CONTEXTS[term[0]]:term[1];
 app.innerHTML='<div class="breadcrumb"><span>Повторение без вариантов</span><span>'+(r.n+1)+' из '+r.q.length+'</span></div><div class="panel"><div class="lesson-hero">🔁</div><div class="eyebrow">'+(x.kind==="fill"?'Заполни пропуск':x.kind==="context-recall"?'Термин в ситуации':'Вспомни термин')+'</div><p class="definition">'+esc(question)+'</p><input class="field" id="review-input" autocomplete="off" placeholder="Напиши ответ"><div class="actions"><button class="primary" data-act="review-check">Проверить</button><button class="secondary" data-act="review-show">Не помню — показать</button>'+(r.errors?'<button class="secondary" data-act="review-skip">Дальше →</button>':'')+'</div>'+(message?'<div class="feedback">'+esc(message)+'</div>':'')+'</div><div class="actions"><button class="secondary" data-act="home">← Закончить</button></div>';
}

 state.progress[chosen]=0;save();window.TrainerVoice.reset();
 const name=levels[chosen].name,next=chosen+1;chosen=null;
 app.innerHTML='<div class="panel" style="text-align:center"><div class="lesson-hero" aria-hidden="true">🎉</div><div class="eyebrow">Уровень завершён</div><h1 style="margin:12px 0">'+esc(name)+'</h1><p class="definition">Ты изучил слова группами, ответил на 30 вопросов разных форматов, составил предложение и дошёл до чтения.</p><div class="actions" style="justify-content:center"><button class="primary" data-act="home">К карте уровней</button>'+(next<levels.length?'<button class="secondary" data-next="'+next+'">Следующий уровень →</button>':'')+'</div></div>';
}
app.addEventListener("click",e=>{
 const target=e.target.closest("button");if(!target)return;
 if(target.hasAttribute("data-speech-level")){speechMenu(Number(target.dataset.speechLevel));return}
 if(target.hasAttribute("data-speech-start")){const level=Number(target.dataset.speechStart),q=speechQueue(level,target.dataset.kind);if(q.length)openSpeech(level,q[0],q);return}
 if(speech){
  const act=target.dataset.act||target.dataset.action||"";
  if(act==="speech-home"){const v=window.TrainerVoice.state();if(v.recording||v.saving)return;speech=null;window.TrainerVoice.reset();viewHome();return}
  if(act==="speech-check"){const v=window.TrainerVoice.state();if(v.recording||v.saving)return;const draft=String(document.getElementById("speech-draft")?.value||"").trim();if(speechTask()[0]!=="Чтение"&&!draft&&!v.blob&&!v.clipId){message="Сначала напиши или запиши свой ответ.";renderSpeech();return}speech.checked=true;message="";renderSpeech();return}
  if(act==="speech-save"){speechSave();return}
  if(act==="speech-next"){const v=window.TrainerVoice.state();if(v.recording||v.saving)return;const q=speech.queue,idx=q.indexOf(speech.task);if(idx+1>=q.length){speechMenu(speech.level);return}openSpeech(speech.level,q[idx+1],q);return}
  if(act==="voice-record"){window.TrainerVoice.record(()=>renderSpeech(),null,s=>{transcript=s});return}
  if(act==="voice-stop"){window.TrainerVoice.stop(()=>renderSpeech());return}
  if(act==="voice-download"){window.TrainerVoice.download();return}
  return
 }
 if(target.dataset.act==="review-start"){startReview();return}
 if(review){
  if(target.dataset.act==="home"){viewHome();return}
  if(target.dataset.act==="review-show"){const x=review.q[review.n];review.errors++;message="Ответ: "+reviewAnswer(x)+". Слово вернётся на повторение.";renderReview();return}
  if(target.dataset.act==="review-skip"){advanceReview(false);return}
  if(target.dataset.act==="review-check"){const x=review.q[review.n],answer=reviewAnswer(x);if(norm(document.getElementById("review-input")?.value)===norm(answer))advanceReview(true);else{review.errors++;message="Пока неверно. Попробуй ещё раз или открой ответ.";renderReview()}return}
  if(target.hasAttribute("data-review-choice")){if(target.dataset.reviewChoice==="yes")advanceReview(true);else{review.errors++;message="Пока неверно. Попробуй другой вариант.";renderReview()}return}
 }
 if(target.hasAttribute("data-buy")||target.dataset.act==="theme-default"){
 let ok=true;if(target.dataset.act==="theme-default"){state.theme="default";save();syncWallet()}else ok=buyReward(target.dataset.buy);
 viewHome();message=ok?"Награда применена.":"Недостаточно монет или закреплённых слов.";const shop=document.getElementById("reward-shop");if(shop){shop.outerHTML=shopHTML();document.getElementById("reward-shop")?.scrollIntoView?.({block:"nearest"})}return
 }
 if(target.hasAttribute("data-level")){openLevel(Number(target.dataset.level));return}
 if(target.hasAttribute("data-next")){openLevel(Number(target.dataset.next));return}
 const act=target.dataset.act||target.dataset.action||"";
 if(act==="home"){viewHome();return}
 if(act==="restart"){
  if(confirm("Начать курс с первого уровня? История, прежние ответы, монеты и купленные награды останутся.")){
   state={...state,done:[],progress:{},learningV2:{},readingHistory:Array.isArray(state.readingHistory)?state.readingHistory:[]};save();viewHome()
  }return
 }
 if(chosen===null)return;
 const l=levelState(chosen),kind=stage(chosen);
 if(act==="study-next"&&kind==="study"){nextStudy();return}
 if(target.hasAttribute("data-choice")&&kind==="practice"){
  if(target.dataset.choice==="yes"){nextPractice(!l.errors)}
  else{l.errors++;message="Пока не тот ответ. Подумай, какое понятие точнее. Ошибаться можно — монеты за этот вопрос начисляются только за первый правильный ответ.";save();viewLesson()}
  return
 }
 if(kind==="practice"){
 const task=deck(chosen,l.group)[l.cursor],term=levels[chosen].terms[task.idx],b=VARIETY[term[0]];
 if(task.kind==="match"){
  const range=groupRange(chosen,l.group),valid=n=>range.some(x=>x.idx===n);
  if(target.hasAttribute("data-match-word")){const n=Number(target.dataset.matchWord);if(valid(n))matchSelected=n;viewLesson();return}
  if(target.hasAttribute("data-match-def")){const n=Number(target.dataset.matchDef);if(valid(n)&&valid(matchSelected)){for(const k of Object.keys(matchPairs))if(matchPairs[k]===n)delete matchPairs[k];matchPairs[matchSelected]=n;matchSelected=null}viewLesson();return}
  if(act==="match-reset"){clearMatch();viewLesson();return}
  if(act==="match-check"){if(Object.keys(matchPairs).length!==range.length)return;if(matchCorrect(range))nextPractice(!l.errors);else{l.errors++;message="Не все пары верны. Пересмотри значения и исправь соответствия.";save();viewLesson()}return}
 }
 if(task.kind==="phrase"){
  if(target.hasAttribute("data-token")){const n=Number(target.dataset.token);if(n>=0&&n<3&&!phraseOrder.includes(n))phraseOrder.push(n);viewLesson();return}
  if(act==="phrase-reset"){phraseOrder=[];viewLesson();return}
  if(act==="phrase-check"){if(phraseOrder.join(",")==="0,1,2")nextPractice(!l.errors);else{l.errors++;phraseOrder=[];message="Попробуй начать с действия или подлежащего с заглавной буквы.";save();viewLesson()}return}
 }
 if(task.kind==="fill"&&act==="fill-check"){
  if(checkedWord(document.getElementById("recall")?.value,b[1]))nextPractice(!l.errors);else{l.errors++;message="Проверь смысл и форму слова в предложении.";save();viewLesson()}return
 }
 }
 if(act==="recall"&&kind==="practice"){
  const task=deck(chosen,l.group)[l.cursor];if(task.kind!=="recall")return;
  const answer=levels[chosen].terms[task.idx][0];
  if(checkedWord(document.getElementById("recall")?.value,answer))nextPractice(!l.errors);
  else{l.errors++;message="Слово пока не вспомнилось. Попробуй ещё раз; можно открыть подсказку.";save();viewLesson()}
  return
 }
 if(act==="hint"&&kind==="practice"){
  const task=deck(chosen,l.group)[l.cursor];const term=levels[chosen].terms[task.idx][0],answer=task.kind==="fill"?VARIETY[term][1]:term;
  l.errors++;message="Подсказка: первая буква «"+answer[0]+"», букв в названии: "+answer.length+".";
  save();viewLesson();return
 }
 if(act==="sentence-hint"&&kind==="sentence"){l.sentenceAssisted=true;save();message="Слово из этого уровня. Начинается на «"+levels[chosen].answer[0]+"».";viewLesson();return}
 if(act==="sentence"&&kind==="sentence"){
  const answer=levels[chosen].answer;
  if(checkedWord(document.getElementById("sentence")?.value,answer)){
   if(!l.sentenceAssisted)reward("v2:l"+chosen+":sentence",5);l.phase="reading";message="";save();viewLesson()
  }else{l.sentenceAssisted=true;save();message="Попробуй снова. Это слово из изученного уровня.";viewLesson()}return
 }
 if(kind!=="reading")return;
 if(act==="voice-record"){window.TrainerVoice.record(()=>viewLesson(),null,s=>{transcript=s});return}
 if(act==="voice-stop"){window.TrainerVoice.stop(()=>viewLesson());return}
 if(act==="voice-download"){window.TrainerVoice.download();return}
 if(act==="assess"){
  const v=window.TrainerVoice.state();readAnalysis=window.TrainerReading.analyze(levels[chosen].read,v.transcript||transcript,v.durationMs);viewLesson();return
 }
 if(act==="finish"){finish();return}
});
app.addEventListener("input",e=>{
 if(speech&&e.target.id==="speech-draft"){
  state.speechDrafts??={};state.speechDrafts[speech.level+":"+speech.task]=e.target.value;save()
 }
});
app.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&e.target.id==="recall"){e.preventDefault();(app.querySelector('[data-act="recall"]')||app.querySelector('[data-act="fill-check"]'))?.click()}
 if(e.key==="Enter"&&e.target.id==="review-input"){e.preventDefault();app.querySelector('[data-act="review-check"]')?.click()}
 if(e.key==="Enter"&&e.target.id==="sentence"){e.preventDefault();app.querySelector('[data-act="sentence"]')?.click()}
});
viewHome();
})();
</script>
</body>
</html>
