<style>

["Протокол совещания","Коммуникация","Документ, фиксирующий обсуждённые вопросы, принятые решения, ответственных и сроки.","Итоги встречи с подрядчиками внесём в ___ совещания.","протокол,протоколе","Важно фиксировать решения, а не только перечислять темы."],
["Конкретизация замечаний","Коммуникация","Уточнение общих претензий до проверяемых фактов, участков и требований.","Вместо спора о вкусе нужна ___ замечаний заказчика.","конкретизация,конкретизации","Покажи место, характер дефекта и критерий, которому оно не соответствует."],
["Распределение полномочий","Коммуникация","Закрепление за участниками прав самостоятельно принимать определённые решения.","Перед делегированием согласуем ___ полномочий между прорабами.","распределение,распределения","Задача без достаточных полномочий может оказаться невыполнимой."],
["Срок исполнения","Коммуникация","Установленный момент или период, к которому задача должна быть выполнена.","В поручении укажем ответственного и ___ исполнения.","срок,сроки","Фраза «как можно скорее» не заменяет определённый срок."],
["Фиксация договорённостей","Коммуникация","Документальное или иное проверяемое закрепление согласованных действий и обязанностей.","После совещания необходима ___ договорённостей с подрядчиками.","фиксация,фиксации","Договорённости должны быть понятны участникам и доступны для проверки."]
];
const PHRASES=[
["Сначала стены смотрит Давид, потом я, потом заказчик.","Приёмка работ проводится поэтапно: первичный контроль — у мастера, повторный — у руководителя, затем предъявление заказчику.","Регламент приёмки"],
["Электрики ещё не закончили, поэтому малярам работать негде.","Фронт малярных работ не готов из-за незавершённых смежных работ.","Фронт работ"],
["Пусть Женя сам решит вопрос с материалами, но отчитается мне.","Делегирую мастеру организацию поставки материалов с согласованными полномочиями и сроком отчётности.","Делегирование"],
["Ребята сделали не так, как у нас было договорено.","Выявлено несоответствие согласованной технологии выполнения работ.","Несоответствие"],
["На встрече договорились, а потом все забыли кто что делает.","Решения, ответственных и сроки исполнения фиксируем в протоколе совещания.","Протокол совещания"],
["Нам нужно побольше людей и инструмента, чтобы начать десять комнат.","Для открытия дополнительных помещений организуем мобилизацию персонала и оборудования.","Мобилизация"],
["Надо понять, почему мы не успеваем к сроку.","Проведём план-фактный анализ сроков и объёмов работ.","План-факт"],
["Пусть заказчик покажет, что именно ему не нравится.","Предлагаю конкретизировать замечания и сверить их с критериями приёмки.","Конкретизация замечаний"],
["Давайте разойдёмся по комнатам, чтобы друг другу не мешать.","Согласуем зонирование и очерёдность смежных работ по помещениям.","Смежные работы"],
["Работа стоит, потому что не привезли всё нужное.","Простой связан с недостаточным ресурсным обеспечением участка.","Ресурсное планирование"],
["Нужно глянуть материалы, когда они приедут.","Организуем входной контроль материалов при поставке.","Входной контроль"],
["Эти косяки всплывают постоянно, надо понять почему.","Необходимо определить причины повторяющихся несоответствий и назначить корректирующие действия.","Корректирующие действия"],
["Там уже не наши решения, пусть Стас разбирается.","Вопрос выходит за пределы моих полномочий; передаю его на решение руководителю.","Полномочия"],
["У нас есть деньги на бумаге, но рабочим сейчас платить нечем.","Возник кассовый разрыв из-за несовпадения сроков поступлений и обязательных выплат.","Кассовый разрыв"],
["Здесь работы побольше, чем мы раньше считали.","Фактический объём работ превышает ранее согласованный объём; требуется уточнение расчёта.","Зона ответственности"]
];
const app=document.getElementById("app");
const KEY="rukovoditel-trainer-v1";
const today=()=>new Date().toLocaleDateString("sv-SE");
const norm=s=>String(s||"").toLowerCase().trim().replaceAll("ё","е").replace(/[.,!?;:]/g,"").replace(/\s+/g," ");
const safe=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let data={version:1,history:[],sequence:0};
try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&Array.isArray(d.history)){data=d;data.sequence=Number(data.sequence)||0;}}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
let selectedMode="mix",session=null,current=null,lastKeys=[];
const labelMode={mix:"Смешанная тренировка",quiz:"Выбери термин",fill:"Вставь слово",card:"Карточка",phrase:"Точная формулировка"};
function historyOf(id){return data.history.filter(a=>a.id===id)}
function analysis(){
 const auto=data.history.filter(a=>a.type==="quiz"||a.type==="fill");
 const correct=auto.filter(a=>a.ok).length;
 const weak=TERMS.map(t=>({term:t[0],bad:historyOf(t[0]).filter(x=>!x.ok).length,good:historyOf(t[0]).filter(x=>x.ok).length})).filter(x=>x.bad>x.good).sort((a,b)=>(b.bad-b.good)-(a.bad-a.good));
 const count=data.history.filter(a=>a.day===today()).length;
 let streak=0;const dates=new Set(data.history.map(a=>a.day));const d=new Date();if(!dates.has(d.toLocaleDateString("sv-SE")))d.setDate(d.getDate()-1);
 while(dates.has(d.toLocaleDateString("sv-SE"))){streak++;d.setDate(d.getDate()-1)}
 return{count,total:data.history.length,accuracy:auto.length?Math.round(correct/auto.length*100):null,weak,streak};
}
function renderHome(){
 session=null;current=null;
 const s=analysis();const done=Math.min(100,Math.round(s.count/12*100));
 app.innerHTML='<div class="eyebrow">Ежедневная практика · 10–15 минут</div><h1>Говори точнее.<br>Руководи увереннее.</h1>'+
 '<p class="lead">Тренируй строительные термины и короткие профессиональные формулировки. Ошибки возвращаются на повторение, а сложность постепенно растёт.</p>'+
 '<button class="primary big" data-action="start">'+(s.count>=12?"Продолжить · ещё 5 заданий":s.total?"Продолжить тренировку":"Начать стартовый тест")+'</button>'+
 '<div class="grid-stats"><div class="stat"><div class="val">'+s.count+'<span style="font-size:14px;color:#a1aaa4"> / 12</span></div><div class="label">Сегодня</div></div>'+
 '<div class="stat"><div class="val">'+(s.accuracy===null?"—":s.accuracy+"%")+'</div><div class="label">Точность тестов</div></div>'+
 '<div class="stat"><div class="val">'+s.weak.length+'</div><div class="label">На повторение</div></div>'+
 '<div class="stat"><div class="val">'+s.streak+'</div><div class="label">Дней подряд</div></div></div>'+
 '<div class="section-title">Режим занятий</div>'+
 '<div class="modes">'+
 modeButton("mix","Смешанная","Все упражнения по очереди")+
 modeButton("fill","Вспомнить слово","Ввести термин без подсказок")+
 modeButton("quiz","Выбрать термин","Четыре близких варианта")+
 modeButton("phrase","Сказать профессионально","Коротко сформулировать мысль")+
 modeButton("card","Карточки","Вспомнить определение")+
 '</div>'+
 (s.weak.length?'<div class="section-title">Стоит повторить</div><div class="weak">'+s.weak.slice(0,5).map(x=>'<span class="pill">'+safe(x.term)+'</span>').join("")+'</div>':"")+
 '<p class="bottomline">Результаты сохраняются только в этом браузере. Новые задания подбираются сразу по твоим ответам — без ожидания обновления. Можно заниматься в любое время.</p>';
}
function modeButton(id,title,detail){
 return '<button class="mode '+(selectedMode===id?"active":"")+'" data-mode="'+id+'"><b>'+title+'</b><small>'+detail+'</small></button>';
}
function modeOfNext(){
 if(selectedMode!=="mix")return selectedMode;
 return ["fill","quiz","phrase","card","fill","quiz"][session.n%6];
}
function scoreFor(id){
 const h=historyOf(id),bad=h.filter(x=>!x.ok).length,good=h.filter(x=>x.ok).length,last=h.length?h[h.length-1]:null;
 const recent=lastKeys.includes(id)?-90:0;
 return (last&&!last.ok?55:0)+(bad-good)*18+(!h.length?25:0)+(last&&last.ok?-h.length:0)+recent+Math.random()*12;
}
function pickNext(){
 const type=modeOfNext();let item=null;
 if(type==="phrase"){
 const candidates=PHRASES.map((p,i)=>({type,id:p[2],key:"p"+i,phrase:p,score:scoreFor(p[2])+Math.random()*4}));
 candidates.sort((a,b)=>b.score-a.score);item=candidates.find(x=>!lastKeys.includes(x.key))||candidates[0];
 }else{
 const candidates=TERMS.map((t,i)=>({type,id:t[0],key:t[0],term:t,score:scoreFor(t[0])+(i%4)*.1}));
 candidates.sort((a,b)=>b.score-a.score);item=candidates[0];
 }
 current={...item,done:false,revealed:false,input:"",ok:false,choice:null};
 lastKeys=[...lastKeys,item.key].slice(-4);
}
function start(){
 session={n:0,limit:analysis().count>=12?5:analysis().total===0?6:Math.max(12-analysis().count,5),correct:0};
 lastKeys=[];pickNext();renderTask();
}
function renderTask(){
 const q=current;if(!q){renderEnd();return}
 const t=q.term;const frac=Math.round(session.n/session.limit*100);
 let content="";
 if(q.type==="quiz"){
 const target=t[0]; let options=TERMS.filter(x=>x[0]!==target&&x[1]===t[1]).sort(()=>Math.random()-.5).slice(0,3);
 if(options.length<3)options=options.concat(TERMS.filter(x=>x[0]!==target&&x[1]!==t[1]).slice(0,3-options.length));
 const choices=[target,...options.map(x=>x[0])].sort(()=>Math.random()-.5);
 if(!q.options)q.options=choices;
 content='<div class="topic">Найди точный термин · '+safe(t[1])+'</div><div class="qtitle">'+safe(t[2])+'</div><div class="answers">'+q.options.map(x=>'<button class="option '+(q.done?(x===target?"right":x===q.choice?"wrong":""):"")+'" '+(q.done?"disabled":"")+' data-answer="'+safe(x)+'">'+safe(x)+'</button>').join("")+'</div>';
 }else if(q.type==="fill"){
 const parts=t[3].split("___");
 content='<div class="topic">Вспомни термин · '+safe(t[1])+'</div><div class="qtitle">'+safe(parts[0])+'<span style="border-bottom:2px solid #9bae9b;color:#47684f"> '+(q.done?safe(t[4].split(",")[0]):"______")+' </span>'+safe(parts[1]||"")+'</div>'+
 (!q.done?'<form id="fill-form"><input class="entry" name="answer" placeholder="Введи слово или выражение" autocomplete="off" autofocus required><div class="actions"><button class="primary big" type="submit">Проверить</button></div></form>':"");
 }else if(q.type==="card"){
 content='<div class="topic">Карточка · '+safe(t[1])+'</div><div class="qtitle">'+safe(t[2])+'</div>'+
 (q.revealed?'<div class="feedback"><div>Ответ:</div><span class="reply">'+safe(t[0])+'</span><p>'+safe(t[5])+'</p>'+(!q.done?'<div class="actions"><button class="secondary" data-rate="false">Нужно повторить</button><button class="primary" data-rate="true">Знаю</button></div>':'')+'</div>':'<div class="actions"><button class="primary" data-action="reveal">Показать термин</button></div>');
 }else if(q.type==="phrase"){
 content='<div class="topic">Сформулируй профессионально</div><div class="qtitle">«'+safe(q.phrase[0])+'»</div><p class="context">Напиши свою короткую формулировку. Дословного совпадения не требуется.</p>'+
 (!q.revealed?'<form id="phrase-form"><textarea class="entry area" name="answer" placeholder="Твой вариант..." required></textarea><div class="actions"><button class="primary big" type="submit">Сравнить с примером</button></div></form>':
 '<div class="feedback"><div>Пример точной формулировки:</div><span class="reply">'+safe(q.phrase[1])+'</span><p>Опорный термин: <b>'+safe(q.phrase[2])+'</b></p><p class="mini">Смысл сохранён, выражение точнее и короче? Отметь сам. Автоматическая оценка свободного текста здесь не выдаётся за экспертную.</p>'+(!q.done?'<div class="actions"><button class="secondary" data-rate="false">Нужно повторить</button><button class="primary" data-rate="true">Получилось</button></div>':'')+'</div>');
 }
 if(q.done){
 if(q.type==="quiz"||q.type==="fill"){
 const title=q.ok?"Верно — закрепляем":"Нужно повторить";
 const answer=q.type==="quiz"?t[0]:t[4].split(",")[0];
 content+='<div class="feedback"><b>'+title+'</b><span class="reply">'+safe(answer)+'</span><div>'+safe(t[5])+'</div></div>';
 }
 content+='<div class="actions"><button class="primary big" data-action="next">Следующее задание</button></div>';
 }
 app.innerHTML='<div class="status"><span>'+labelMode[q.type]+'</span><span>'+(session.n+1)+' / '+session.limit+'</span></div><div class="track"><div class="bar" style="width:'+frac+'%"></div></div>'+
 '<section class="panel">'+content+'</section><div class="actions"><button class="link" data-action="home">← На главную</button></div>';
 const focus=app.querySelector("input[autofocus]");if(focus)focus.focus();
}
function logAnswer(ok,input){
 const q=current;
 data.sequence++;data.history.push({id:q.id,type:q.type,ok:!!ok,day:today(),time:new Date().toISOString(),input:String(input||"").slice(0,500)});
 if(data.history.length>5000)data.history=data.history.slice(-3500);
 persist();q.ok=!!ok;q.done=true;if(ok)session.correct++;renderTask();
}
function renderEnd(){
 const an=analysis();
 app.innerHTML='<section class="panel end"><div class="eyebrow">Сессия завершена</div><h1>'+session.n+' заданий</h1><p class="lead" style="margin:0 auto 20px">Ты закрепил '+session.correct+' из '+session.n+' ответов. Сложные термины вернутся в следующих занятиях.</p>'+
 '<div class="grid-stats"><div class="stat"><div class="val">'+an.count+'</div><div class="label">Сегодня</div></div><div class="stat"><div class="val">'+(an.accuracy===null?"—":an.accuracy+"%")+'</div><div class="label">Точность</div></div>'+
 '<div class="stat"><div class="val">'+an.weak.length+'</div><div class="label">Повторить</div></div><div class="stat"><div class="val">'+an.streak+'</div><div class="label">Серия</div></div></div>'+
 '<button class="primary big" data-action="extra">Ещё 5 заданий</button><div class="actions" style="justify-content:center"><button class="link" data-action="home">На главную</button></div></section>';
}
app.addEventListener("click",e=>{
 const m=e.target.closest("[data-mode]");if(m){selectedMode=m.dataset.mode;renderHome();return}
 const a=e.target.closest("[data-action]");if(a){
 if(a.dataset.action==="start"){start();return}
 if(a.dataset.action==="extra"){selectedMode="mix";session={n:0,limit:5,correct:0};pickNext();renderTask();return}
 if(a.dataset.action==="home"){renderHome();return}
 if(a.dataset.action==="next"){session.n++;if(session.n>=session.limit){current=null;renderEnd();}else{pickNext();renderTask();}return}
 if(a.dataset.action==="reveal"){current.revealed=true;renderTask();return}
 }
 const choice=e.target.closest("[data-answer]");if(choice&&current&&!current.done&&current.type==="quiz"){current.choice=choice.dataset.answer;logAnswer(current.choice===current.term[0],current.choice);return}
 const rate=e.target.closest("[data-rate]");if(rate&&current&&!current.done){logAnswer(rate.dataset.rate==="true",current.input);return}
});
app.addEventListener("submit",e=>{
 if(!current)return;
 if(e.target.id==="fill-form"&&!current.done){e.preventDefault();const v=e.target.elements.answer.value;const acceptable=current.term[4].split(",").some(x=>norm(x)===norm(v));logAnswer(acceptable,v);}
 if(e.target.id==="phrase-form"&&!current.revealed){e.preventDefault();current.input=e.target.elements.answer.value;current.revealed=true;renderTask();}
});
renderHome();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){});});}
})();
</script>
</body>
</html>
