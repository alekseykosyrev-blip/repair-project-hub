}

 }).filter(x=>x.bad>0&&(x.lastWrong||x.bad>=x.good))

 function dkey(z){return z.toISOString().slice(0,10)}
 if(!dates.has(dkey(utc3Date)))utc3Date.setUTCDate(utc3Date.getUTCDate()-1);
 while(dates.has(dkey(utc3Date))){streak++;utc3Date.setUTCDate(utc3Date.getUTCDate()-1)}

 '<div class="grid-stats"><div class="stat"><div class="val">'+a.total+'</div><div class="label">Всего ответов</div></div><div class="stat"><div class="val">'+a.gradedWrong+'</div><div class="label">Ошибки в тестах</div></div><div class="stat"><div class="val">'+(a.accuracy===null?"—":a.accuracy+"%")+'</div><div class="label">Точность тестов</div></div><div class="stat"><div class="val">'+a.count+'</div><div class="label">Сегодня</div></div></div>'+
 '<div class="section-title">Ответы по типам</div><div class="grid-stats">'+rows+'</div>'+
 '<div class="section-title">Персональная программа</div><section class="panel">'+
 '<p style="margin:0;color:#506358;line-height:1.7">'+(a.graded===0?"Начни с тестов, чтобы получить объективный результат.":"На следующем занятии — прежде всего активное вспоминание и закрепление сложных терминов. Проверено автоматически: "+a.graded+"; ошибки: "+a.gradedWrong+".")+'</p>'+
 (a.weak.length?'<div class="section-title">На повторение</div><div>'+issues+'</div>':'<p class="mini">По текущим данным трудных терминов не выделено.</p>')+
 '<div class="section-title">История ошибок</div>'+(a.mistakes.length?allMistakes:'<p class="mini">Ошибок пока нет.</p>')+
 '<p class="bottomline">План пересчитывается после каждого ответа и при следующем посещении. Статистика видна в любое время. Сайт пока не передаёт ответы автоматически в ChatGPT.</p></section>'+
 '<div class="section-title">Архив · последние 100 ответов</div><section class="panel">'+(logs||'<p class="mini">Пока нет ответов.</p>')+'</section>'+
 '<div class="actions"><button class="primary" data-action="copy-report">Скопировать отчёт для ChatGPT</button><button class="secondary" data-action="export">Скачать весь архив JSON</button></div>'+
 '<div class="actions"><button class="link" data-action="home">← К тренировке</button></div>';
}
function renderHome(){
 session=null;current=null;
 const s=analysis();const done=Math.min(100,Math.round(s.count/20*100));
 const due=TERMS.filter(t=>{const z=learningState(t[0]);return z.due&&z.seen}).length;
 const mastered=TERMS.filter(t=>new Set(historyOf(t[0]).filter(x=>x.type==="fill"&&x.ok).map(x=>x.day)).size>=2).length;
 app.innerHTML='<div class="eyebrow">Ежедневная практика · 20 вопросов за занятие</div><h1>Говори точнее.<br>Руководи увереннее.</h1>'+
 '<p class="lead">Тренируй профессиональные термины, точную речь и структуру короткого ответа руководителю. Здесь нет задач на распределение оборудования или управление бригадой.</p>'+
 '<button class="primary big" data-action="start">'+(s.total?"Начать 20 заданий":"Начать первые 20 заданий")+'</button>'+
 '<div class="grid-stats"><div class="stat"><div class="val">'+s.count+'<span style="font-size:14px;color:#a1aaa4"> / 20</span></div><div class="label">Сегодня</div></div>'+
 '<div class="stat"><div class="val">'+(s.accuracy===null?"—":s.accuracy+"%")+'</div><div class="label">Точность тестов</div></div>'+
 '<div class="stat"><div class="val">'+s.weak.length+'</div><div class="label">На повторение</div></div>'+
 '<div class="stat"><div class="val">'+s.streak+'</div><div class="label">Дней подряд</div></div></div>'+
 '<div class="section-title">Режим занятий</div>'+
 '<div class="modes">'+
 modeButton("mix","Смешанная","Все упражнения по очереди")+
 modeButton("logic","Структура доклада","Говори с руководством по существу")+
 modeButton("contrast","Различай понятия","Находи точный термин")+
 modeButton("fill","Вспомнить слово","Ввести термин без подсказок")+
 modeButton("quiz","Выбрать термин","Четыре близких варианта")+
 modeButton("phrase","Сказать профессионально","Коротко сформулировать мысль")+
 modeButton("card","Карточки","Вспомнить определение")+
 '</div>'+
 (s.weak.length?'<div class="section-title">Стоит повторить</div><div class="weak">'+s.weak.slice(0,5).map(x=>'<span class="pill">'+safe(x.term)+'</span>').join("")+'</div>':"")+
 '<div class="actions">'+(s.weak.length?'<button class="secondary" data-action="review">Повторить сложное · 20 заданий</button>':'')+'<button class="secondary" data-action="report">Журнал и анализ ответов</button></div>'+
 '<p class="mini">На повторение сегодня: '+due+' терминов · закреплено в разные дни: '+mastered+'.</p>'+
 '<p class="bottomline">Результаты сохраняются в этом браузере, а план адаптируется после каждого ответа. Для анализа в ChatGPT открой журнал и скопируй отчёт.</p>';
}
function modeButton(id,title,detail){
 return '<button class="mode '+(selectedMode===id?"active":"")+'" data-mode="'+id+'"><b>'+title+'</b><small>'+detail+'</small></button>';
}
function modeOfNext(){
 if(session?.reviewOnly)return ["fill","contrast","fill","card","fill","quiz","phrase","fill","contrast","fill"][session.n%10];
 if(selectedMode!=="mix")return selectedMode;
 return ["fill","quiz","phrase","fill","contrast","phrase","logic","fill","quiz","phrase","fill","contrast","card","fill","phrase","quiz","fill","logic","phrase","quiz"][session.n%20];
}
function scoreFor(id,type){
 const h=historyOf(id),bad=h.filter(x=>!x.ok).length,good=h.filter(x=>x.ok).length,last=h.length?h[h.length-1]:null;
 const ls=learningState(id),shouldRepeat=bad>0&&(!last.ok||bad>=good);
 const recent=lastKeys.includes(id)?-140:0;
 const sessionSeen=session?.seenIds?.includes(id)?-110:0;
 const reviewPenalty=session?.reviewOnly&&!shouldRepeat?-75:0;
 const quizRight=h.filter(x=>x.type==="quiz"&&x.ok).length;
 const fillRight=h.filter(x=>x.type==="fill"&&x.ok).length;
 const ladder=type==="quiz"?-Math.min(quizRight,4)*12:type==="fill"?Math.min(quizRight,3)*10-Math.min(fillRight,4)*5:0;
 return (last&&!last.ok?42:0)+(bad-good)*8+(!h.length?31:0)+(ls.seen?(ls.due?22:-20):0)+recent+sessionSeen+reviewPenalty+ladder+Math.random()*14;
}
function pickNext(){
 const type=modeOfNext();let item=null;
 if(type==="contrast"){
 const candidates=CONTRASTS.map((c,i)=>({type,id:"Контраст: "+c[1],key:"c"+i,contrast:c,score:scoreFor("Контраст: "+c[1],type)+(session?.seenKeys?.includes("c"+i)?-180:0)}));
 candidates.sort((a,b)=>b.score-a.score);item=candidates[0];
 }else if(type==="logic"){
 const candidates=CHAINS.map((c,i)=>({type,id:"Логика: "+c[0],key:"l"+i,chain:c,score:scoreFor("Логика: "+c[0],type)+(session?.seenKeys?.includes("l"+i)?-180:0)}));
 candidates.sort((a,b)=>b.score-a.score);item=candidates[0];
 }else if(type==="phrase"){
 const candidates=PHRASES.map((p,i)=>({type,id:p[2],key:"p"+i,phrase:p,score:scoreFor(p[2],type)+(session?.seenKeys?.includes("p"+i)?-135:0)+Math.random()*4}));
 candidates.sort((a,b)=>b.score-a.score);item=candidates.find(x=>!lastKeys.includes(x.key))||candidates[0];
 }else{
 const candidates=TERMS.map((t,i)=>({type,id:t[0],key:t[0],term:t,score:scoreFor(t[0],type)+(i%4)*.1}));
 candidates.sort((a,b)=>b.score-a.score);item=candidates[0];
 }
 current={...item,done:false,revealed:false,input:"",ok:false,choice:null,hintLevel:0,draft:"",order:[]};
 session.seenIds??=[];session.seenIds.push(item.id);
 session.seenKeys??=[];session.seenKeys.push(item.key);
 session.seenIds??=[];session.seenIds.push(item.id);
 lastKeys=[...lastKeys,item.key].slice(-4);
}
function start(){
 session={n:0,limit:20,correct:0,reviewOnly:false,seenIds:[]};
 lastKeys=[];pickNext();renderTask();
}
function renderTask(){
 const q=current;if(!q){renderEnd();return}
 const t=q.term;const frac=Math.round(session.n/session.limit*100);
 let content="";
 if(q.type==="contrast"){
 const c=q.contrast;
 if(!q.options)q.options=[c[1],...c[2]].sort(()=>Math.random()-.5);
 content='<div class="topic">Различие терминов</div><div class="qtitle">'+safe(c[0])+'</div>'+
 '<div class="answers">'+q.options.map(opt=>'<button class="option '+(q.done?(opt===c[1]?'right':opt===q.choice?'wrong':''):'')+'" '+(q.done?'disabled':'')+' data-answer="'+safe(opt)+'">'+safe(opt)+'</button>').join('')+'</div>'+
 (q.done?'<div class="feedback"><b>'+(q.ok?'Термин выбран верно':'Нужен другой термин')+'</b>'+
 '<span class="reply">'+safe(c[1])+'</span>'+explainTerm(TERMS.find(x=>x[0]===c[1])||[c[1],'',c[3],c[4],c[1],c[3]])+
 '<p>'+safe(c[3])+'</p><p class="mini">Пример в речи: '+safe(c[4])+'</p></div>':'');
 }else if(q.type==="logic"){
 const c=q.chain;
 if(!q.shuffle){q.shuffle=[0,1,2].sort(()=>Math.random()-.5);}
 const chosen=q.order, used=new Set(chosen);
 content='<div class="topic">Структура ответа руководителю · опорный термин: '+safe(c[0])+'</div>'+
 '<div class="qtitle">«'+safe(c[1])+'»</div>'+
 '<p class="context">Как кратко и аргументированно ответить руководителю? Расставь высказывания: <b>тезис → основание → следующий шаг</b>. Формулировки уже даны — тренируем порядок деловой речи.</p>'+
 '<div class="answers">'+chosen.map((i,n)=>'<div class="hint"><b>'+(n+1)+'.</b> '+safe(c[2][i])+'</div>').join("")+
 (!q.done?q.shuffle.filter(i=>!used.has(i)).map(i=>'<button class="option" data-step="'+i+'">'+safe(c[2][i])+'</button>').join(""):'')+'</div>'+
 (!q.done?'<div class="actions">'+(chosen.length?'<button class="secondary" data-action="undo-step">Убрать последний</button>':'')+
 (chosen.length===3?'<button class="primary" data-action="check-logic">Проверить порядок</button>':'')+'</div>':
 '<div class="feedback"><b>'+(q.ok?'Верная последовательность':'Есть ошибка в последовательности')+'</b>'+
 '<div class="explain">'+c[2].map((x,i)=>'<p><b>'+(i+1)+'. '+["Тезис","Основание","Следующий шаг"][i]+':</b> '+safe(x)+'</p>').join("")+
 '<p class="mini">'+safe(c[3])+'</p></div></div>');
 }else if(q.type==="quiz"){
 const target=t[0]; let options=TERMS.filter(x=>x[0]!==target&&x[1]===t[1]).sort(()=>Math.random()-.5).slice(0,3);
 if(options.length<3)options=options.concat(TERMS.filter(x=>x[0]!==target&&x[1]!==t[1]).slice(0,3-options.length));
 const choices=[target,...options.map(x=>x[0])].sort(()=>Math.random()-.5);
 if(!q.options)q.options=choices;
 content='<div class="topic">Найди точный термин · '+safe(t[1])+'</div><div class="qtitle">'+safe(t[2])+'</div><div class="answers">'+q.options.map(x=>'<button class="option '+(q.done?(x===target?"right":x===q.choice?"wrong":""):"")+'" '+(q.done?"disabled":"")+' data-answer="'+safe(x)+'">'+safe(x)+'</button>').join("")+'</div>';
 }else if(q.type==="fill"){
 const parts=t[3].split("___");
 content='<div class="topic">Вспомни термин · '+safe(t[1])+'</div><div class="qtitle">'+safe(parts[0])+'<span style="border-bottom:2px solid #9bae9b;color:#47684f"> '+(q.done?safe(t[4].split(",")[0]):"______")+' </span>'+safe(parts[1]||"")+'</div>'+
 (!q.done?'<form id="fill-form"><input class="entry" name="answer" placeholder="Введи слово или выражение" autocomplete="off" autofocus required><div class="actions"><button class="primary" type="submit">Проверить</button><button class="secondary" type="button" data-action="dontknow">Не помню</button></div></form>':"");
 }else if(q.type==="card"){
 content='<div class="topic">Карточка · '+safe(t[1])+'</div><div class="qtitle">'+safe(t[2])+'</div>'+
 (q.revealed?'<div class="feedback"><div>Термин:</div><span class="reply">'+safe(t[0])+'</span>'+explainTerm(t)+
 (!q.done?'<div class="actions"><button class="secondary" data-rate="false">Пока не запомнил</button><button class="primary" data-rate="true">Могу объяснить</button></div>':'')+'</div>':
 '<p class="context">Попробуй самостоятельно вспомнить одно точное название для этого определения.</p><div class="actions"><button class="primary" data-action="reveal">Узнать термин и объяснение</button></div>');
 }else if(q.type==="phrase"){
 const hint1='<div class="hint"><b>Шаг 1 · О чём главное?</b> Тема — '+safe(q.phrase[2])+'. Скажи, что произошло или что требуется.</div>';
 const hint2='<div class="hint"><b>Шаг 2 · Логика предложения</b> Сначала сообщи факт. Затем объясни причину или последствия, если они важны. В конце назови следующий шаг. Используй короткие конструкции: «Выявлено…», «Это влияет на…», «Предлагаю…».</div>';
 content='<div class="topic">Тренировка точной речи</div><div class="qtitle">«'+safe(q.phrase[0])+'»</div>'+
 '<p class="context">Не усложняй язык. Сохрани смысл и попробуй сказать короче, используя один точный рабочий термин.</p>'+
 (!q.revealed?
 '<div class="mini">Шаг 1: назови главное. Шаг 2: выбери нужное слово. Шаг 3: собери короткую фразу.</div>'+
 (q.hintLevel>=1?hint1:'')+(q.hintLevel>=2?hint2:'')+
 '<form id="phrase-form"><textarea class="entry area" name="answer" placeholder="Попробуй начать простыми словами…" required>'+safe(q.draft||"")+'</textarea><div class="actions"><button class="primary" type="submit">Сравнить</button>'+
 (q.hintLevel<2?'<button class="secondary" type="button" data-action="hint">'+(q.hintLevel===0?'Дай опорное слово':'Покажи начало фразы')+'</button>':'')+
 '</div></form>':
 '<div class="feedback"><b>Твой вариант</b><div class="draft">'+safe(q.input||"(не записан)")+'</div>'+
 '<div class="explain-title">Возможный вариант</div><span class="reply">'+safe(q.phrase[1])+'</span>'+
 '<p>Главное опорное слово: <b>'+safe(q.phrase[2])+'</b>.</p>'+
 '<p class="mini">Сравни три вещи: смысл сохранён? Есть точный термин? Получилось лаконичнее? Формулировать дословно не нужно. Эту запись приложение не оценивает автоматически.</p>'+
 (!q.done?'<div class="actions"><button class="secondary" data-rate="false">Пока трудно</button><button class="primary" data-rate="true">Справился</button></div>':'')+'</div>');
 }
 if(q.done){
 if(q.type==="quiz"||q.type==="fill"){
 const title=q.ok?"Верно — закрепляем":"Нужно повторить";
 const answer=q.type==="quiz"?t[0]:t[4].split(",")[0];
 content+='<div class="feedback"><b>'+title+'</b><span class="reply">'+safe(answer)+'</span>'+explainTerm(t)+'</div>';
 }
 content+='<div class="actions"><button class="primary big" data-action="next">Следующее задание</button></div>';
 }
 app.innerHTML='<div class="status"><span>'+labelMode[q.type]+'</span><span>'+(session.n+1)+' / '+session.limit+'</span></div><div class="track"><div class="bar" style="width:'+frac+'%"></div></div>'+
 '<section class="panel">'+content+'</section><div class="actions"><button class="link" data-action="home">← На главную</button></div>';
 const focus=app.querySelector("input[autofocus]");if(focus)focus.focus();
}
function logAnswer(ok,input){
 const q=current;
 data.sequence++;data.history.push({id:q.id,type:q.type,ok:!!ok,day:today(),time:new Date().toISOString(),input:String(input||"").slice(0,500)});
 if(data.history.length>5000)data.history=data.history.slice(-3500);
 persist();q.ok=!!ok;q.done=true;if(ok)session.correct++;renderTask();
}
function renderEnd(){
 const an=analysis();
 app.innerHTML='<section class="panel end"><div class="eyebrow">Сессия завершена</div><h1>'+session.n+' заданий</h1><p class="lead" style="margin:0 auto 20px">Успешных ответов и самооценок: '+session.correct+' из '+session.n+'. Сложные термины вернутся в следующих занятиях.</p>'+
 '<div class="grid-stats"><div class="stat"><div class="val">'+an.count+'</div><div class="label">Сегодня</div></div><div class="stat"><div class="val">'+(an.accuracy===null?"—":an.accuracy+"%")+'</div><div class="label">Точность</div></div>'+
 '<div class="stat"><div class="val">'+an.weak.length+'</div><div class="label">Повторить</div></div><div class="stat"><div class="val">'+an.streak+'</div><div class="label">Серия</div></div></div>'+
 '<button class="primary big" data-action="extra">Ещё 20 заданий</button><div class="actions" style="justify-content:center"><button class="link" data-action="home">На главную</button></div></section>';
}
app.addEventListener("click",e=>{
 const m=e.target.closest("[data-mode]");if(m){selectedMode=m.dataset.mode;renderHome();return}
 const a=e.target.closest("[data-action]");if(a){
 if(a.dataset.action==="start"){start();return}
 if(a.dataset.action==="review"){selectedMode="mix";session={n:0,limit:20,correct:0,reviewOnly:true,seenIds:[]};lastKeys=[];pickNext();renderTask();return}
 if(a.dataset.action==="extra"){selectedMode="mix";session={n:0,limit:20,correct:0,reviewOnly:false,seenIds:[]};lastKeys=[];pickNext();renderTask();return}
 if(a.dataset.action==="home"){renderHome();return}
 if(a.dataset.action==="report"){renderReport();return}
 if(a.dataset.action==="copy-report"){copyReport();return}
 if(a.dataset.action==="export"){saveReport();return}
 if(a.dataset.action==="undo-step"&&current?.type==="logic"&&!current.done){current.order.pop();renderTask();return}
 if(a.dataset.action==="check-logic"&&current?.type==="logic"&&!current.done&&current.order.length===3){logAnswer(current.order.every((n,i)=>n===i),current.order.map(i=>current.chain[2][i]).join(" → "));return}
 if(a.dataset.action==="next"){session.n++;if(session.n>=session.limit){current=null;renderEnd();}else{pickNext();renderTask();}return}
 if(a.dataset.action==="reveal"){current.revealed=true;renderTask();return}
 if(a.dataset.action==="dontknow"&&current&&!current.done&&current.type==="fill"){logAnswer(false,"Не помню");return}
 if(a.dataset.action==="hint"&&current&&!current.revealed&&current.type==="phrase"){
   current.hintLevel=Math.min(2,(current.hintLevel||0)+1);renderTask();return;
 }
 }
 const step=e.target.closest("[data-step]");if(step&&current?.type==="logic"&&!current.done){const n=Number(step.dataset.step);if(!current.order.includes(n)&&current.order.length<3){current.order.push(n);renderTask();}return}
 const choice=e.target.closest("[data-answer]");if(choice&&current&&!current.done&&(current.type==="quiz"||current.type==="contrast")){current.choice=choice.dataset.answer;logAnswer(current.choice===(current.type==="quiz"?current.term[0]:current.contrast[1]),current.choice);return}
 const rate=e.target.closest("[data-rate]");if(rate&&current&&!current.done){logAnswer(rate.dataset.rate==="true",current.input);return}
});
app.addEventListener("input",e=>{if(current&&current.type==="phrase"&&!current.revealed&&e.target.name==="answer")current.draft=e.target.value;});
app.addEventListener("submit",e=>{
 if(!current)return;
 if(e.target.id==="fill-form"&&!current.done){e.preventDefault();const v=e.target.elements.answer.value;const acceptable=current.term[4].split(",").some(x=>norm(x)===norm(v));logAnswer(acceptable,v);}
 if(e.target.id==="phrase-form"&&!current.revealed){e.preventDefault();current.input=e.target.elements.answer.value;current.draft=current.input;current.revealed=true;renderTask();}
});
renderHome();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){});});}
})();
</script>
