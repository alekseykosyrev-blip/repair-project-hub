name: Webflow smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          for f in app*.js field-actions.js measurements.js estimator-bridge.js sw.js; do
            node --check "$f"
          done
      - name: Run finance smoke test
        run: node tests/finance-smoke.mjs
      - name: Run offline smoke test
        run: node tests/offline-smoke.mjs
      - name: Run helper smoke test
        run: node tests/helper-smoke.mjs
      - name: Run measurements smoke test
        run: node tests/measurements-smoke.mjs
      - name: Run finance correction regression test
        run: node tests/finance-history-safety.mjs
