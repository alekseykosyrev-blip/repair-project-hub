name: StroyCRM v2 production checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  crm_v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check script syntax
        run: |
          node --check crm-core.mjs
          node --check crm-app.mjs
          node --check sw.js
      - name: Check finance and storage logic
        run: node tests/crm-core.mjs
      - name: Check replacement shell and offline assets
        run: node tests/crm-shell.mjs
      - name: Install browser DOM test runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund happy-dom@15.11.7
      - name: Run interactive UI workflow
        run: node tests/crm-ui.mjs
